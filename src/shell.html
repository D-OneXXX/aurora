<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>极光帷幕 · AURORA CURTAIN</title>
<style>
  :root{
    --green:#39ff8a;
    --magenta:#ff2d6f;
    --bar-h:92px;
    --hud-text: rgba(186,226,206,.62);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; background:#000; overflow:hidden;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------------------------------------------------------------- HUD */
  .hud{
    position:fixed; inset:auto 0 0 0; height:var(--bar-h); z-index:30;
    pointer-events:none; opacity:1; transition:opacity .35s ease;
  }
  body.hud-hidden .hud{ opacity:0; }
  .hud::before{                      /* 底缘渐隐条 */
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(2,6,8,0) 0%, rgba(2,6,8,.42) 46%, rgba(2,6,8,.72) 100%);
    backdrop-filter:blur(2px);
  }
  .hud::after{                       /* 顶部发丝线 */
    content:""; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, rgba(57,255,138,0) 0%, rgba(57,255,138,.28) 22%, rgba(255,45,111,.26) 78%, rgba(255,45,111,0) 100%);
  }

  .hud-left{
    position:absolute; left:20px; bottom:20px;
    font:400 11px/1.62 ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
    letter-spacing:.09em; color:var(--hud-text); white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.8);
  }
  .hud-left span{ display:block; }
  .hud-left b{ color:rgba(57,255,138,.85); font-weight:500; }
  .hud-left .l2{ opacity:.78; }
  .hud-left .l3{ opacity:.45; font-size:9.5px; letter-spacing:.16em; }

  .hud-mid{
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    font-style:italic; font-size:13px; letter-spacing:.16em;
    color:rgba(206,238,224,.46); white-space:nowrap;
    text-shadow:0 1px 8px rgba(0,0,0,.85);
  }
  .hud-mid span{ font-style:normal; letter-spacing:.30em; font-size:10px; opacity:.72; }

  .hud-right{
    position:absolute; right:20px; bottom:20px;
    display:flex; align-items:center; gap:10px; pointer-events:auto;
  }
  .hue{ display:flex; align-items:center; gap:9px; }
  .hue-label{
    font:500 10px/1 ui-monospace, Consolas, monospace; letter-spacing:.18em;
    color:rgba(206,238,224,.55);
  }
  .hue-track{
    position:relative; width:148px; height:9px; border-radius:5px;
    background:linear-gradient(90deg,#ff2d2d,#ff9a2d,#ffe62d,#39ff8a,#2de1ff,#2d6bff,#c02dff,#ff2d6f,#ff2d2d);
    box-shadow:0 0 10px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .hue-track input[type=range]{
    position:absolute; inset:-8px 0; width:100%; height:25px; margin:0;
    -webkit-appearance:none; appearance:none; background:transparent; cursor:ew-resize;
  }
  .hue-track input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:25px; background:transparent; cursor:ew-resize;
  }
  .hue-track input[type=range]::-moz-range-thumb{
    width:14px; height:25px; border:0; background:transparent; cursor:ew-resize;
  }
  .hue-knob{
    position:absolute; top:-4px; left:0%; width:2px; height:17px; margin-left:-1px;
    background:#f2fff8; border-radius:1px;
    box-shadow:0 0 7px rgba(57,255,138,.95), 0 0 2px rgba(255,255,255,.9);
    pointer-events:none;
  }
  .hue-num{
    width:56px; padding:4px 6px; text-align:right;
    font:500 11px/1 ui-monospace, Consolas, monospace; letter-spacing:.06em;
    color:#39ff8a; background:rgba(255,255,255,.06);
    border:1px solid rgba(57,255,138,.22); border-radius:4px; outline:none;
  }
  .hue-num:focus{ border-color:rgba(57,255,138,.6); background:rgba(57,255,138,.08); }

  /* --------------------------------------------- 恢复默认小箭头（旋转图标） */
  .hud-btn{
    display:flex; align-items:center; justify-content:center;
    width:24px; height:24px; padding:0; margin-right:2px;
    color:rgba(206,238,224,.62); background:rgba(255,255,255,.05);
    border:1px solid rgba(57,255,138,.20); border-radius:50%;
    cursor:pointer; pointer-events:auto; outline:none;
    transition:color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .hud-btn:hover{
    color:#8effc0; border-color:rgba(57,255,138,.55);
    background:rgba(57,255,138,.12); transform:translateY(-1px);
  }
  .hud-btn:active{ transform:translateY(0) scale(.94); }
  .hud-btn.spin svg{ animation:btnspin .5s cubic-bezier(.4,0,.2,1); }
  @keyframes btnspin{ from{ transform:rotate(0deg); } to{ transform:rotate(-360deg); } }

  /* ----------------------------------------------------- lil-gui 调试面板 */
  #guiHost{ position:fixed; right:20px; bottom:calc(var(--bar-h) + 16px); z-index:40; }
  #guiHost .lil-gui{
    position:relative; top:auto; right:auto; left:auto; bottom:auto;
    --background-color: rgba(6,14,12,.50);
    --widget-color: rgba(255,255,255,.10);
    --hover-color: rgba(57,255,138,.20);
    --focus-color: rgba(57,255,138,.30);
    --number-color: #39ff8a;
    --string-color: #ff2d6f;
    --text-color: #cfe9dc;
    --title-background-color: rgba(8,22,18,.66);
    --font-size: 11px;
    --width: 236px;
    border:1px solid rgba(57,255,138,.14);
    border-radius:7px; overflow:hidden; opacity:.92;
    backdrop-filter:blur(9px) saturate(1.15);
    box-shadow:0 10px 34px rgba(0,0,0,.55);
  }
  #guiHost .lil-gui .title{ letter-spacing:.10em; font-weight:500; }
  #guiHost .lil-gui .name{ letter-spacing:.04em; }

  /* ------------------------------------------------------- 启动 / 错误层 */
  #loading{
    position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
    background:#01030a; color:rgba(186,226,206,.7); letter-spacing:.24em; font-size:12px;
    transition:opacity .6s ease; pointer-events:none;
  }
  #loading.gone{ opacity:0; }
  @media (max-width:820px){
    .hud-mid{ display:none; }
    #guiHost{ --width:200px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- ===================== L5 叠加 HUD：底部控制条 ===================== -->
<div class="hud">
  <div class="hud-left" id="hudCoords">CAM  X +0.00  Y +1.35  Z +14.00   ·   FPS --   ·   ----×----</div>
  <div class="hud-mid">aurora curtain — a realtime study in light <span>· 极光帷幕</span></div>
  <div class="hud-right">
    <button id="resetBtn" class="hud-btn" type="button" title="恢复默认参数（快捷键 R）" aria-label="恢复默认参数">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.6 12a8.4 8.4 0 1 0 2.5-6"/>
        <path d="M3.3 4.2v5.3h5.3"/>
      </svg>
    </button>
    <div class="hue">
      <span class="hue-label">HUE</span>
      <div class="hue-track">
        <div class="hue-knob" id="hueKnob"></div>
        <input id="hueRange" type="range" min="0" max="1" step="0.001" value="0" aria-label="色相偏移">
      </div>
      <input id="hueNum" class="hue-num" type="number" min="0" max="1" step="0.01" value="0.00" aria-label="色相数值">
    </div>
  </div>
</div>
<div id="guiHost"></div>

<div id="loading">GENERATING AURORA…</div>

<!-- 运行期错误直接显示在画面上（着色器编译失败 / WebGL 不可用等） -->
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('loading');
  if (!el) return;
  el.classList.remove('gone');
  el.style.color = '#ff2d6f';
  el.style.padding = '0 8vw';
  el.style.textAlign = 'center';
  el.style.letterSpacing = '.06em';
  el.textContent = 'ERR · ' + ((e && (e.message || (e.error && e.error.message))) || 'unknown error');
});
</script>

<script>/*__APP_BUNDLE__*/</script>
</body>
</html>
